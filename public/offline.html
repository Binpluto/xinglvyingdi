<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#0b5267" />
    <title>星旅营地 · 暂时离线</title>
    <style>
      *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:28px;background:radial-gradient(circle at 50% 18%,#196f86,#092c3a 56%,#061e29);color:#f7edcf;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.card{width:min(100%,420px);padding:38px 28px;border:1px solid rgba(239,200,101,.45);border-radius:28px;text-align:center;background:rgba(5,34,46,.82);box-shadow:0 24px 70px rgba(0,0,0,.32)}.star{font-size:42px;color:#f1cd67}.eyebrow{font-size:12px;letter-spacing:.24em;opacity:.72}.card h1{font-family:serif;font-size:28px;margin:18px 0 12px}.card p{line-height:1.7;color:#d6e5e2;margin:0 0 24px}.card button{border:0;border-radius:999px;padding:13px 24px;background:linear-gradient(135deg,#f2cf6d,#e8ad47);color:#17343c;font-weight:700;font-size:15px}
    </style>
  </head>
  <body>
    <main class="card">
      <div class="star">✦</div>
      <div class="eyebrow">STARCAMP · 星旅营地</div>
      <h1>星路暂时中断</h1>
      <p>请检查网络后重新连接。账号、任务与成长记录仍安全保存在云端。</p>
      <button type="button" onclick="location.reload()">重新连接</button>
    </main>
  </body>
</html>
