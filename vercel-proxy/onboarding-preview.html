<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>新手三问 · 星旅营地第 1 项预览</title><link rel="stylesheet" href="/first-action.css?v=16"><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top right,#f5e6bd66,transparent 60%),#eaf3e9;color:#28574d;font-family:Arial,'PingFang SC',sans-serif}main{max-width:840px;margin:8vh auto;padding:30px}small{color:#98733a;letter-spacing:.1em}h1{font:600 38px/1.3 'Songti SC',serif}p{line-height:1.9;color:#647e72}.preview-intro{border:1px solid #c8d7c5;border-radius:22px;padding:28px;background:#fffdf5}button{font:inherit;border-radius:10px;border:0;background:#285d54;color:white;padding:13px 20px;cursor:pointer}.review-list{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:24px 0}.review-list div{border-top:1px solid #cfddc9;padding-top:15px;font-size:13px;line-height:1.7}#preview-status{white-space:pre-line;border-left:3px solid #c6a65d;padding-left:15px}footer{font-size:12px;line-height:1.8;margin-top:25px;color:#859182}@media(max-width:600px){main{margin:3vh auto;padding:18px}h1{font-size:29px}.preview-intro{padding:20px}.review-list{grid-template-columns:1fr}}</style></head>
<body><main><small>STARCAMP · 顺序迭代 / 01</small><h1>让第一次启程，<br>从一件做得到的小事开始。</h1><p>这是第 1 项「新手三问 → 第一项行动」的独立交互预览。<br>尚未改变正式网站注册流程，也未开始第 2 项。</p><section class="preview-intro"><button id="open-preview">重新体验新手三问 →</button><div class="review-list"><div><b>三个选择</b><br>当前方向 · 每日时间 · 主要阻碍</div><div><b>一个行动</b><br>10–15 分钟，有明确完成标准</div><div><b>由你决定</b><br>可修改、可返回、可随时跳过</div></div><p id="preview-status">可尝试不同答案，检查推荐是否适合自己。</p></section><footer>这是专门用于验收的预览，不需要登录，不创建真实任务、不启动计时、不获得积分、不开放付费功能。</footer></main><script type="module">
import {openFirstAction} from './first-action.mjs?v=16';
const status=document.querySelector('#preview-status');
function open(){openFirstAction({preview:true,onSkip:()=>{status.textContent='已跳过。正式使用时，不会强制回答，也不会扣除积分。你可以再次打开预览。';},onDone:result=>{status.textContent=`预览行动：${result.quest.title}\n完成标准：${result.quest.detail}\n未写入真实账号。可以重新体验其他选项。`;}});}
document.querySelector('#open-preview').onclick=open;open();
</script></body></html>
