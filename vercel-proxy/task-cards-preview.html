<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>系统任务行动说明 · 第 2 项验收预览</title><link rel="stylesheet" href="/task-guidance.css?v=19"><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top right,#f3e2b65c,transparent 50%),#edf3e9;color:#2c5245;font-family:Arial,'PingFang SC',sans-serif}main{max-width:1160px;margin:auto;padding:38px 24px 60px}.eyebrow{font-size:11px;color:#9e834c;letter-spacing:.18em}h1{font:600 34px/1.4 'Songti SC',serif;margin:15px 0 8px}.intro{font-size:14px;line-height:1.9;color:#758773;max-width:780px}.context{background:#f9fbf4;border:1px solid #d7e0ce;border-radius:15px;padding:18px;margin:24px 0;display:flex;gap:18px;align-items:flex-end;flex-wrap:wrap}.context label{display:grid;gap:7px;font-size:11px;color:#829079}.context select{padding:9px;border:1px solid #c7d6bd;border-radius:8px;color:#456447;background:white;font-size:13px}.context button{margin-left:auto;padding:10px 14px;background:transparent;color:#6d8268;border:1px solid #c4d4be;border-radius:8px;cursor:pointer}.metrics{display:flex;gap:20px;font-size:12px;color:#7b8e73;flex-wrap:wrap}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:18px}.demo-task{border:1px solid #d4ddc7;border-radius:17px;padding:22px 18px;background:#fffdf6;min-width:0;align-self:start}.demo-task .difficulty{font-size:10px;letter-spacing:.06em;color:#a98c4c}.demo-task h2{font:600 21px/1.4 'Songti SC',serif;margin:12px 0 8px}.demo-task>.requirement{font-size:12px;line-height:1.85;color:#829079;margin:0 0 12px}.complete-row{display:flex;align-items:center;gap:9px;font-size:11px;color:#8d987c;margin-top:18px;border-top:1px dashed #d9dfce;padding-top:13px}.complete-row input{accent-color:#527b59;width:16px;height:16px}.footnote{font-size:11px;line-height:1.8;color:#909d85;margin:24px 0}.done{border-color:#9ebc98}.done h2:after{content:' ✓';color:#729363}#preview-status{font-size:12px;color:#66865e;min-height:20px;margin-top:18px}@media(max-width:850px){.cards{grid-template-columns:1fr}.demo-task{padding:20px}.context{gap:12px}.context label{flex:1;min-width:120px}main{padding:26px 16px}h1{font-size:28px}.metrics{gap:10px}}</style></head><body><main><small class="eyebrow">STARCAMP · 顺序迭代 / 02 · 独立验收预览</small><h1>知道为什么，也知道怎么开始。</h1><p class="intro">系统任务增加预计时长、适合精力、起步动作和推荐原因。切换下面的示例背景，可以查看适配提示如何变化；任务本身不会被自动替换或降低完成标准。</p><section class="context" aria-label="模拟个人背景"><label>本月方向<select id="goal"><option value="thesis">论文</option><option value="exam">备考</option><option value="work">工作 / 项目</option><option value="job">求职</option><option value="fitness">健身</option><option value="sleep">早睡计划</option></select></label><label>每日启动预算<select id="budget"><option value="10">10 分钟</option><option value="30" selected>30 分钟</option><option value="60">60 分钟</option></select></label><label>当前精力<select id="energy"><option value="low">低</option><option value="medium" selected>中</option><option value="high">高</option></select></label><button id="reset">重置预览</button></section><div id="metrics" class="metrics" aria-label="本次预览记录"></div><div id="cards" class="cards"></div><p id="preview-status" role="status"></p><p class="footnote">本轮只优化任务说明和反馈，不包含第 3 项的低精力模式或任务替换。选择与反馈不等于完成任务；真实完成仍以原任务勾选和云端记录为准。此预览不登录、不请求业务 API、不保存真实账号，也不发放奖励。</p></main><script type="module">
import {createTaskGuidance} from './task-guidance.mjs?v=19';
import {systemTaskBaseDetails} from './system-task-base-details.mjs';
const tasks=[{id:1,title:'整理今日航向',source:'system-daily-easy',type:'日常',difficulty:'简单',reward:25},{id:2,title:'专注秘境',source:'system-daily-medium',type:'支线',difficulty:'普通',reward:45},{id:3,title:'深度远征',source:'system-daily-hard',type:'主线',difficulty:'困难',reward:80}].map(q=>({...q,detail:systemTaskBaseDetails[q.title],done:0}));
const feedback=new Map(),cards=document.querySelector('#cards'),status=document.querySelector('#preview-status');
function render(){const context={goal:document.querySelector('#goal').value,budget:Number(document.querySelector('#budget').value),energy:document.querySelector('#energy').value};const open=[...cards.querySelectorAll('.demo-task')].filter(c=>c.querySelector('.task-guidance-why')?.open).map(c=>c.dataset.id);cards.replaceChildren();tasks.forEach(task=>{const card=document.createElement('article');card.className='demo-task'+(task.done?' done':'');card.dataset.id=String(task.id);const badge=document.createElement('small');badge.className='difficulty';badge.textContent=`系统任务 · ${task.difficulty} · ${task.type}`;const title=document.createElement('h2');title.textContent=task.title;const detail=document.createElement('p');detail.className='requirement';detail.textContent=task.detail;const guidance=createTaskGuidance(task,context,{preview:true,feedback:feedback.get(task.id),onFeedback:value=>{feedback.set(task.id,value);status.textContent='预览反馈已更新；没有修改真实任务、类型或积分。';render();}});guidance.querySelector('.task-guidance-why').open=open.includes(String(task.id));const complete=document.createElement('label');complete.className='complete-row';const check=document.createElement('input');check.type='checkbox';check.checked=!!task.done;check.setAttribute('aria-label',`模拟完成${task.title}`);check.onchange=()=>{task.done=check.checked?1:0;status.textContent='只更新示例完成状态，不发放积分。';render();};complete.append(check,document.createTextNode('模拟完成（仅用于验收）'));card.append(badge,title,detail,guidance,complete);cards.append(card);});const values=[...feedback.values()];document.querySelector('#metrics').textContent=`本次预览 · 展示 ${tasks.length} 项　已选择 ${values.filter(x=>x.decision==='adopt').length} 项　已反馈不适合 ${values.filter(x=>x.decision==='decline').length} 项　示例完成 ${tasks.filter(t=>t.done).length} 项`;}
document.querySelectorAll('.context select').forEach(select=>select.onchange=render);document.querySelector('#reset').onclick=()=>{feedback.clear();tasks.forEach(t=>t.done=0);status.textContent='预览已重置。';render();};render();
</script></body></html>
