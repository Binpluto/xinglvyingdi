<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>轻装模式 · 星旅营地</title><link rel="stylesheet" href="/first-action.css?v=18"><link rel="stylesheet" href="/task-guidance.css?v=19"><link rel="stylesheet" href="/gentle-mode.css?v=20"><style>*{box-sizing:border-box}body{margin:0;background:#edf3e8;color:#385746;font-family:Arial,'PingFang SC',sans-serif}main{max-width:900px;margin:auto;padding:30px 20px}h1{font:600 30px 'Songti SC',serif}.intro,.summary{font-size:13px;line-height:1.8;color:#829174}.tools{display:flex;gap:12px;margin:20px 0;align-items:center;flex-wrap:wrap}.tools button{padding:9px 15px;border-radius:9px;background:#fffdf7;border:1px solid #cdd9bf;color:#59744d;cursor:pointer}.tools label{font-size:12px;color:#829174}.quest{background:#fffdf6;border:1px solid #d6dfc9;border-radius:15px;padding:20px;margin-bottom:14px;display:flex;align-items:flex-start;gap:14px}.quest-check{accent-color:#577b57;margin-top:10px;width:18px;height:18px}.quest-text{flex:1;min-width:0}.quest-text h4{margin:6px 0 10px;font-size:18px}.quest-text>p{font-size:12px;color:#7f9273;line-height:1.8}.calendar-source{font-size:10px;color:#a18b50}.quest.done{opacity:.7}.task-guidance-facts{max-width:460px}.preview-note{padding:14px;background:#f8f0d8;border-radius:12px;font-size:12px;line-height:1.8;color:#9b884e}</style></head><body><main><small class="gentle-eyebrow">STARCAMP · 第 3 项 · 无真实账号写入的演示</small><h1>轻装一点，也可以继续前进。</h1><p class="intro">试试展开、暂缓或改选行动。确认改选前不会新增记录；改选后原任务仍保留，不会被自动完成。此页所有数据都是示例。</p><div class="tools"><button id="reset">重置演示</button><label><input id="fail-next" type="checkbox">模拟下次保存失败</label></div><p id="summary" class="summary"></p><section class="quest-card"><div class="quest-list"></div></section><p class="preview-note">“不惩罚”指不扣已有经验和货币。未完成仍按实际记录统计，不自动修复连续天数，也不消耗休整券。显示偏好与暂缓只在当前浏览器本日保留，新增任务正式使用时保存到云端。</p></main><script type="module">
import {installTaskGuidance} from './task-guidance.mjs?v=20';import {installGentleMode} from './gentle-mode.mjs?v=20';import {systemTaskBaseDetails} from './system-task-base-details.mjs';
const d=new Date(),date=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;let data;
function initial(){return {user:{email:'gentle-demo@example.invalid',xp:500,coins:200},dailyDeparture:{energyLevel:'low'},habit:{currentStreak:7},quests:[{id:1,title:'整理今日航向',source:'system-daily-easy',type:'日常',reward:25},{id:2,title:'专注秘境',source:'system-daily-medium',type:'支线',reward:45},{id:3,title:'深度远征',source:'system-daily-hard',type:'主线',reward:80}].map(q=>({...q,detail:systemTaskBaseDetails[q.title],dueAt:date,done:0}))};}
function renderHost(){const list=document.querySelector('.quest-list');list.replaceChildren();data.quests.forEach(q=>{const row=document.createElement('article');row.className='quest'+(q.done?' done':'');row.dataset.questId=String(q.id);const check=document.createElement('input');check.type='checkbox';check.className='quest-check';check.checked=!!q.done;check.disabled=!!q.done;check.setAttribute('aria-label',`模拟完成${q.title}`);check.onchange=()=>{if(!q.done){q.done=1;data.user.xp+=q.reward;}renderHost();window.dispatchEvent(new CustomEvent('starcamp:game-data',{detail:data}));};const text=document.createElement('div');text.className='quest-text';const source=document.createElement('span');source.className=`calendar-source source-${q.source}`;source.textContent=`${q.source==='manual'?'已改选的轻装行动':'系统任务'} · ${q.type} · 完成后 ${q.reward} EXP`;const title=document.createElement('h4');title.textContent=q.title;const detail=document.createElement('p');detail.textContent=q.detail;text.append(source,title,detail);row.append(check,text);list.append(row);});document.querySelector('#summary').textContent=`示例经验 ${data.user.xp} · 货币 ${data.user.coins} · 连续 ${data.habit.currentStreak} 天 · 保留原任务 3 项 · 新增轻装 ${data.quests.length-3} 项`;}
data=initial();window.starcampTransport={peek:()=>data};window.fetch=async(url,opts={})=>{if(!String(url).startsWith('/api/game'))throw new Error('演示不访问外部接口');if(opts.method==='POST'){if(document.querySelector('#fail-next').checked){document.querySelector('#fail-next').checked=false;return Response.json({error:'模拟保存失败，原任务未改动'},{status:500});}const p=JSON.parse(opts.body);if(p.action==='createQuest')data.quests.push({id:Math.max(...data.quests.map(q=>q.id))+1,title:p.title,detail:p.detail.slice(0,100),source:'manual',type:p.type,reward:30,done:0,dueAt:null});else if(p.action==='editQuest'){Object.assign(data.quests.find(q=>q.id===p.questId),{title:p.title,detail:p.detail,type:p.type});}else throw new Error('不允许修改其他示例状态');}return Response.json(data);};
window.addEventListener('starcamp:gentle-applied',event=>{event.preventDefault();data=event.detail;renderHost();});document.querySelector('#reset').onclick=()=>{localStorage.removeItem(`starcamp:gentle:gentle-demo@example.invalid:${date}`);window.dispatchEvent(new Event('starcamp:session-reset'));data=initial();renderHost();window.dispatchEvent(new CustomEvent('starcamp:game-data',{detail:data}));};renderHost();installTaskGuidance();installGentleMode();
</script></body></html>
